name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --package-path app/VPNSwitch

      - name: Test
        run: swift test --package-path app/VPNSwitch

      - name: Shell syntax check
        run: bash -n bin/*.sh lib/*.sh

      - name: Shell tests
        run: bash tests/vpn-run-bounded-test.sh && bash tests/nord-ikev2-profile-test.sh
