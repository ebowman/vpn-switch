name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --package-path app/VPNSwitch

      - name: Test
        run: swift test --package-path app/VPNSwitch

      - name: Shell syntax check
        run: bash -n bin/*.sh lib/*.sh
